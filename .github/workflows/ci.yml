name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: orderpilot_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Build the workspace libraries first so their .d.ts exist for the apps
      # to typecheck against (topological order is handled by pnpm -r).
      - run: pnpm --filter @orderpilot/shared --filter @orderpilot/db -r build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/orderpilot_test
      - run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/orderpilot_test
          REDIS_URL: redis://localhost:6379

  # Runs the cross-tenant isolation suite on every PR. If this ever fails,
  # do not merge — it means one tenant can read another's customers.
  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: orderpilot_rls }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/orderpilot_rls
      - run: pnpm --filter @orderpilot/db test:rls
        env:
          DATABASE_URL: postgres://orderpilot_app:change_me_in_deploy@localhost:5432/orderpilot_rls
